<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Atlas</title><link rel="stylesheet" href="vendor/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;color:#203a36;background:#f4f6f1}header{padding:20px 28px;border-bottom:1px solid #d7dfd4;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0}header p{margin:2px 0;color:#63736b}.badge{border:1px solid #c9d8c9;border-radius:20px;padding:5px 13px;font-size:12px;white-space:nowrap}main{display:grid;grid-template-columns:280px 1fr;height:calc(100dvh - 79px);min-height:480px}aside{padding:24px;overflow:auto;background:#fff;border-right:1px solid #d7dfd4}h2{font-size:18px;margin:0 0 12px}.hint{color:#63736b;font-size:13px}button{font:inherit;cursor:pointer;border:1px solid #d4ddd3;background:#fff;border-radius:9px;padding:10px 12px;color:inherit}button:hover,button[aria-pressed=true]{background:#e7f0e5;border-color:#477556}button:focus-visible{outline:3px solid #36855d;outline-offset:3px}.buildings{display:grid;gap:8px;margin:18px 0}.buildings button{text-align:left}.reset{width:100%;background:#174c3c;color:white}#detail{margin-top:24px;border-top:1px solid #ddd;padding-top:18px}#map{height:100%;background:#e9eddf}.pin{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#174c3c;color:white;border:3px solid white;box-shadow:0 2px 8px #0004;font-weight:700}.leaflet-container{font:14px system-ui,sans-serif}a{color:#276546}.error{position:absolute;z-index:1000;background:white;padding:16px;color:#a22}@media(max-width:700px){header{padding:12px 16px}h1{font-size:20px}.badge{display:none}main{display:flex;flex-direction:column;height:auto;min-height:0}aside{padding:16px;border:0}.buildings{grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0}.buildings button{font-size:12px;padding:8px}#detail{margin-top:12px;padding-top:10px}#map{height:65dvh;min-height:380px}.reset{width:auto}}
</style></head><body><header><h1>Campus Atlas</h1></header><main><aside><h2>Buildings</h2><div class="buildings" id="buildings"></div><button class="reset" id="reset">Reset view</button></aside><div id="map" aria-label="Interactive HKU campus map"></div></main><script src="vendor/leaflet.js"></script><script>
const width=842,height=595;
const bounds=[[0,0],[height,width]];
const map=L.map('map',{crs:L.CRS.Simple,minZoom:-3,maxZoom:3,zoomSnap:0.25,maxBounds:[[-100,-100],[height+100,width+100]],maxBoundsViscosity:0.8});
const overlay=L.imageOverlay('assets/hku-main-campus.svg',bounds,{attribution:'Map: HKU Estates Office / April 2025'}).addTo(map);
overlay.on('error',()=>{const error=document.createElement('p');error.className='error';error.textContent='Unable to load map. Please reload.';document.getElementById('map').append(error)});
const buildings=[{id:26,name:'Main Library',x:278,y:430},{id:32,name:'Haking Wong Building',x:404,y:394},{id:38,name:'Chi Wah Learning Commons',x:534,y:440}];
function fit(){map.invalidateSize();map.fitBounds(bounds,{padding:[12,12]});}
for(const b of buildings){const position=[height-b.y,b.x];const marker=L.marker(position,{title:b.name,icon:L.divIcon({className:'',html:'<span class="pin">'+b.id+'</span>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map);const label=document.createElement('strong');label.textContent=b.name;marker.bindPopup(label);const button=document.createElement('button');button.textContent=b.name;button.setAttribute('aria-pressed','false');document.getElementById('buildings').append(button);function select(){document.querySelectorAll('#buildings button').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));}button.addEventListener('click',()=>{select();map.setView(position,1);marker.openPopup()});marker.on('click',select);}
document.getElementById('reset').addEventListener('click',()=>{map.closePopup();document.querySelectorAll('#buildings button').forEach(el=>el.setAttribute('aria-pressed','false'));fit()});fit();window.addEventListener('resize',()=>map.invalidateSize());
</script></body></html>
