<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f6f4">
  <title>Campus Atlas</title>
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/campus.css">
</head>
<body>
  <main>
    <aside aria-label="Facility browser">
      <header class="header">
        <div><a class="brand" href="/">Campus Atlas<span aria-hidden="true">.</span></a><p class="location">HKU / Main Campus</p></div>
        {% if admin_page %}<a class="back-link" href="/" aria-label="Back to campus map" title="Back to campus map">↗</a>{% endif %}
      </header>
      <div class="filters">
        <label for="building" class="sr-only">Building</label>
        <div class="building-field"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M6 21V4h12v17M9 8h1m4 0h1M9 12h1m4 0h1M10 21v-5h4v5"/></svg><select id="building"></select></div>
        <div id="categories" class="categories" role="group" aria-label="Facility category"></div>
      </div>
      {% if admin_page %}
      <div class="management">
        <form id="login" hidden>
          <label>Email<input name="email" type="email" autocomplete="username" required></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="primary">Admin sign in</button>
        </form>
        <div class="admin-actions"><button id="add" class="primary" hidden>+ Add facility</button><button id="account" class="text-button" hidden>Sign out</button></div>
      </div>
      {% endif %}
      <p id="message" role="alert"></p>
      <div class="results-heading"><h1>Facilities <span id="count" aria-live="polite">…</span></h1><button id="reset" class="text-button">Reset</button></div>
      <section id="items" aria-label="Facilities"></section>
    </aside>
    <section class="map-panel" aria-label="Campus map">
      <div id="map"></div>
      <button id="full-map" class="map-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg>Full map</button>
    </section>
  </main>
  {% if admin_page %}
  <dialog id="facility-dialog" aria-labelledby="editor-title">
    <form id="editor">
      <h2 id="editor-title">Add facility</h2>
      <p id="editor-message" role="alert"></p>
      <label>Building<select name="buildingID" required></select></label>
      <label>Category<select name="categoryID" required></select></label>
      <div class="form-row">
        <label>Floor<input name="floor" maxlength="20" required></label>
        <label>Status<select name="facility_status"><option>Available</option><option>Unavailable</option><option>Unknown</option></select></label>
      </div>
      <div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save changes</button></div>
    </form>
  </dialog>
  {% endif %}
  <script src="/vendor/leaflet.js"></script>
  <script src="/campus.js"></script>
</body>
</html>
